name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        # node's own runner; there is nothing to install. The tests read the
        # functions they cover out of src/app.js, so they exercise the shipped
        # source rather than a copy of it.
        #
        # Files, not the directory: passing `test/` only works on newer Node,
        # where it is discovered. Node 22 tries to run it as a module and fails.
        run: node --test test/*.test.mjs
