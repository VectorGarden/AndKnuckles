name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run unit tests
        # Node's own runner, no install step. Name the files rather than the
        # directory: `node --test test/` only works on newer Node.
        run: node --test test/*.test.mjs

  dom:
    name: dom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        # only the one browser; the tests load index.html over file://, so there
        # is nothing else to provision
        run: npx playwright install --with-deps chromium

      - name: Run DOM tests
        run: node --test test/dom/*.test.mjs
