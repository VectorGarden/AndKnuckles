name: Assets match the pipeline

# index.html has the artwork baked into it as base64, so it is possible to hand-edit
# a glyph table or paste an asset and leave the page and tools/ disagreeing. Nothing
# at runtime would notice: the page still works, it is just no longer what the
# pipeline produces, and the next person to rebuild gets a diff they did not make.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/go/go.mod
          cache: false            # no dependencies, so nothing to cache

      - name: Rebuild the assets and compare
        # --check restores index.html to whatever it found and exits non-zero on a
        # mismatch. No dependencies to install -- the decoders are all first-party,
        # compression included; the only import outside tools/ is node:zlib, for
        # reading PNGs back.
        run: node tools/build-all.mjs --check

      - name: Rebuild them in Go and compare
        # The Go pipeline in tools/go builds the same bytes; this holds it to the
        # committed page too. After the Node check, not beside it: both write
        # tools/out and index.html.
        run: go -C tools/go run . --check
